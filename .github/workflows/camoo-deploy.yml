name: Deploy Flutter Web to Camoo Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Upload to Camoo Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAMOO_FTP_SERVER }}
          username: ${{ secrets.CAMOO_FTP_USERNAME }}
          password: ${{ secrets.CAMOO_FTP_PASSWORD }}
          local-dir: ./build/web/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state.json
